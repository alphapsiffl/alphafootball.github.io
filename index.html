<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Alpha Psi Fake Football League — Est. 2020">
  <title>Alpha Psi Fake Football League</title>
  <link rel="stylesheet" href="style.css?v=261">
<style>
.record-trade-value-mark{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;min-width:180px}.record-trade-value-mark span{font-size:2.35rem;font-weight:900;line-height:1;color:#f0d477}.record-trade-value-mark small{margin-top:6px;font-size:.72rem;letter-spacing:.12em;font-weight:800;color:#f0d477}.trade-value-table-wrap{overflow-x:auto}.trade-value-record-table{width:100%;border-collapse:collapse;min-width:680px}.trade-value-record-table th,.trade-value-record-table td{padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.12);text-align:left}.trade-value-record-table th{font-size:.7rem;letter-spacing:.12em;color:#f0d477}.trade-value-record-table td{font-size:.9rem}.trade-value-record-table td:first-child{width:42px;color:#aaa}.trade-value-record-table td:nth-child(3){font-weight:900}.trade-value-net{color:#f0d477;font-size:1rem!important}.record-feature-trade-value{margin-top:24px}
@media(max-width:700px){.record-trade-value-mark{min-width:105px}.record-trade-value-mark span{font-size:1.5rem}.record-trade-value-mark small{font-size:.58rem}.trade-value-record-table{min-width:620px}.trade-value-record-table th,.trade-value-record-table td{padding:9px 10px}}
</style>
</head>
<body>
<header class="site-header">
  <div class="topbar">
    <div class="mini-brand">ΑΨ</div>
    <div class="topbar-title">ALPHA PSI FAKE FOOTBALL LEAGUE</div>
    <div class="topbar-est">EST. 2020</div>
  </div>
</header>

<main>
  <section class="league-hero">
    <img src="alpha-psi-logo.png" alt="Alpha Psi logo" class="league-logo">
    <div class="hero-copy">
      <div class="hero-kicker">ALPHA PSI</div>
      <h1>FAKE FOOTBALL LEAGUE</h1>
      <p class="motto">To better the man, to better the football</p>
      <div class="est-line"><span></span> EST. 2020 <span></span></div>
    </div>
  </section>

  

  <nav class="main-tabs" aria-label="League sections">
  <button class="tab active" data-page="home">Home</button>
  <button class="tab" data-page="members">Members</button>
  <div class="history-nav-item">
    <button class="tab history-nav-tab" data-page="history" aria-expanded="false" aria-controls="history-nav-menu">History <span class="history-nav-caret">⌄</span></button>
    <div class="history-nav-menu" id="history-nav-menu" role="menu" aria-label="History sections" hidden>
      <button type="button" class="history-nav-option" data-history-nav-section="allpsi" role="menuitem">Papa’s All-Psi</button>
      <button type="button" class="history-nav-option" data-history-nav-section="punishments" role="menuitem">Punishments</button>
    </div>
  </div>
  <div class="records-nav-item">
    <button class="tab records-nav-tab" data-page="records" aria-expanded="false" aria-controls="records-nav-menu">Records <span class="records-nav-caret">⌄</span></button>
    <div class="records-nav-menu" id="records-nav-menu" role="menu" aria-label="Records sections" hidden>
      <button type="button" class="records-nav-option" data-record-nav-section="records" role="menuitem">League Records</button>
      <button type="button" class="records-nav-option" data-record-nav-section="rivalries" role="menuitem">Rivalries</button>
      <button type="button" class="records-nav-option" data-record-nav-section="career" role="menuitem">Top 10s</button>
    </div>
  </div>
  <button class="tab" data-page="rules">Rules</button>
  <button class="tab" data-page="espnbets">ESPNBets</button>
  <button class="tab" data-page="chat">Chat</button>
</nav>

  <section id="content" class="content-area"></section>
</main>

<footer>Alpha Psi Fake Football League • Est. 2020</footer>

<script src="script.js?v=261"></script>
